
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitLog | 悦动记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --safe-top: env(safe-area-inset-top); 
            --safe-bottom: env(safe-area-inset-bottom); 
        }
        body { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 0px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .active-nav { color: #2563eb; }
        .active-nav .nav-dot { opacity: 1; transform: scale(1); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        nav { padding-bottom: calc(15px + var(--safe-bottom)); height: calc(85px + var(--safe-bottom)); }
        main { padding-bottom: calc(100px + var(--safe-bottom)); }
        .header-pt { padding-top: calc(1.2rem + var(--safe-top)); }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-slate-900 overflow-hidden">
    <div class="flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-2xl relative overflow-hidden">
        
        <header class="z-30 bg-white/95 backdrop-blur-md sticky top-0 border-b border-slate-100 px-6 py-3 flex items-center header-pt">
            <h1 class="text-3xl font-black bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent tracking-tighter shrink-0">FITLOG</h1>
            <div class="h-4 w-[1px] bg-slate-200 mx-4 shrink-0"></div>
            <p id="header-banner" class="text-[14px] text-slate-400 font-bold italic truncate flex-1 pl-1"></p>
        </header>

        <main id="main-scroll" class="flex-1 overflow-y-auto custom-scrollbar bg-slate-50/30">
            <!-- 首页 -->
            <div id="tab-home" class="tab-content active p-4 space-y-6 pt-6">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-blue-600 rounded-[2rem] p-6 text-white card-shadow relative overflow-hidden group">
                        <div id="stat-total" class="text-3xl font-black mono leading-none">0</div>
                        <div class="text-[11px] opacity-80 font-black tracking-widest mt-2">累计训练</div>
                    </div>
                    <div class="bg-slate-900 rounded-[2rem] p-6 text-white card-shadow relative overflow-hidden group">
                        <div id="stat-month" class="text-3xl font-black mono leading-none">0</div>
                        <div class="text-[11px] opacity-80 font-black tracking-widest mt-2">本月训练</div>
                    </div>
                </div>
                <div class="flex justify-between items-end px-1">
                    <div>
                        <h2 class="text-xl font-black text-slate-800">训练日志</h2>
                        <p class="text-[11px] text-slate-400 font-bold">坚持就是胜利</p>
                    </div>
                    <button onclick="openEditor()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-[13px] font-black shadow-lg shadow-blue-100 active:scale-95 transition-all">记一笔</button>
                </div>
                <div id="log-list" class="space-y-4"></div>
            </div>

            <!-- 日历 -->
            <div id="tab-calendar" class="tab-content p-4 space-y-4">
                <div class="bg-white rounded-[2rem] p-6 border border-slate-100 card-shadow">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="calendar-title" class="text-xl font-black text-slate-800"></h2>
                        <div class="flex gap-2">
                            <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-xl text-slate-500">←</button>
                            <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-xl text-slate-500">→</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-black text-slate-300 mb-2">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="calendar-days" class="grid grid-cols-7 gap-y-4 gap-x-2 text-center"></div>
                </div>
                <div id="calendar-detail"></div>
            </div>

            <!-- 统计 -->
            <div id="tab-stats" class="tab-content p-4 space-y-6">
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center shadow-sm">
                        <div class="text-[10px] font-black text-red-500 mb-1">深蹲 PR</div>
                        <div id="pr-squat" class="text-lg font-black mono">--</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center shadow-sm">
                        <div class="text-[10px] font-black text-blue-500 mb-1">卧推 PR</div>
                        <div id="pr-bench" class="text-lg font-black mono">--</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center shadow-sm">
                        <div class="text-[10px] font-black text-indigo-500 mb-1">硬拉 PR</div>
                        <div id="pr-deadlift" class="text-lg font-black mono">--</div>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="bg-white rounded-[1.5rem] p-5 card-shadow border border-slate-100"><h3 class="text-[13px] font-black text-slate-800 mb-3">总训练容量趋势 (KG)</h3><canvas id="volume-chart" height="180"></canvas></div>
                    <div class="bg-white rounded-[1.5rem] p-5 card-shadow border border-slate-100"><h3 class="text-[13px] font-black text-slate-800 mb-3">SBD 力量趋势 (KG)</h3><canvas id="sbd-chart" height="180"></canvas></div>
                    <div class="bg-white rounded-[1.5rem] p-5 card-shadow border border-slate-100"><h3 class="text-[13px] font-black text-slate-800 mb-3 text-orange-500">体重变化 (KG)</h3><canvas id="weight-chart" height="150"></canvas></div>
                    <div class="bg-white rounded-[1.5rem] p-5 card-shadow border border-slate-100"><h3 class="text-[13px] font-black text-slate-800 mb-3 text-pink-500">体脂比例 (%)</h3><canvas id="fat-chart" height="150"></canvas></div>
                </div>
            </div>

            <!-- 睡眠 -->
            <div id="tab-sleep" class="tab-content p-4 space-y-6">
                <div class="bg-white rounded-[2rem] p-6 border border-slate-100 card-shadow space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-black text-slate-800">睡眠记录</h2>
                        <input type="date" id="sleep-tab-date" class="text-[12px] font-black bg-slate-50 px-3 py-1.5 rounded-lg outline-none" onchange="loadSleepDataForDate(this.value)">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] text-slate-400 font-black block uppercase tracking-wider">入睡时间 (滚轮/点击)</label>
                            <div class="flex items-center gap-1 bg-slate-50 rounded-xl p-2 justify-center">
                                <input type="text" id="sleep-tab-start-h" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-tab-start-h', 23)" onclick="window.adjustValue('sleep-tab-start-h', 1, 23)" oncontextmenu="window.adjustValue('sleep-tab-start-h', -1, 23); return false;">
                                <span class="font-black">:</span>
                                <input type="text" id="sleep-tab-start-m" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-tab-start-m', 59)" onclick="window.adjustValue('sleep-tab-start-m', 5, 59)" oncontextmenu="window.adjustValue('sleep-tab-start-m', -5, 59); return false;">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] text-slate-400 font-black block uppercase tracking-wider">醒来时间 (滚轮/点击)</label>
                            <div class="flex items-center gap-1 bg-slate-50 rounded-xl p-2 justify-center">
                                <input type="text" id="sleep-tab-end-h" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-tab-end-h', 23)" onclick="window.adjustValue('sleep-tab-end-h', 1, 23)" oncontextmenu="window.adjustValue('sleep-tab-end-h', -1, 23); return false;">
                                <span class="font-black">:</span>
                                <input type="text" id="sleep-tab-end-m" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-tab-end-m', 59)" onclick="window.adjustValue('sleep-tab-end-m', 5, 59)" oncontextmenu="window.adjustValue('sleep-tab-end-m', -5, 59); return false;">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-slate-50 p-2 rounded-xl text-center">
                            <label class="text-[9px] text-slate-400 font-black block mb-1">梦境</label>
                            <input type="number" id="sleep-tab-dreams" class="w-full bg-transparent text-center font-black mono outline-none" value="0">
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl text-center">
                            <label class="text-[9px] text-slate-400 font-black block mb-1">中途醒来</label>
                            <input type="number" id="sleep-tab-wakes" class="w-full bg-transparent text-center font-black mono outline-none" value="0">
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl text-center">
                            <label class="text-[9px] text-slate-400 font-black block mb-1">体感</label>
                            <select id="sleep-tab-tiredness" class="w-full bg-transparent text-center font-black outline-none text-[12px]">
                                <option value="refreshed">精神</option>
                                <option value="normal" selected>正常</option>
                                <option value="tired">疲惫</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="saveSleepFromTab()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-black text-[13px] active:scale-95 transition-all">保存睡眠记录</button>
                </div>

                <div class="bg-white rounded-[1.5rem] p-5 card-shadow border border-slate-100">
                    <h3 class="text-[13px] font-black text-slate-800 mb-3 text-purple-500">睡眠时长趋势 (小时)</h3>
                    <canvas id="sleep-chart" height="150"></canvas>
                </div>

                <div class="bg-white rounded-[2rem] p-6 border border-slate-100 card-shadow">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="sleep-calendar-title" class="text-xl font-black text-slate-800">睡眠质量日历</h2>
                        <div class="flex gap-2">
                            <button onclick="changeSleepMonth(-1)" class="w-8 h-8 flex items-center justify-center bg-slate-50 rounded-lg text-slate-500">←</button>
                            <button onclick="changeSleepMonth(1)" class="w-8 h-8 flex items-center justify-center bg-slate-50 rounded-lg text-slate-500">→</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-black text-slate-300 mb-2">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="sleep-calendar-days" class="grid grid-cols-7 gap-y-3 gap-x-1 text-center"></div>
                    <div class="mt-4 flex justify-center gap-4 text-[10px] font-bold">
                        <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-emerald-400"></div>精神</div>
                        <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-blue-400"></div>正常</div>
                        <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-amber-400"></div>疲惫</div>
                    </div>
                </div>
            </div>

            <!-- 动作库 -->
            <div id="tab-library" class="tab-content p-4 space-y-4">
                <div class="bg-white p-6 rounded-[2rem] card-shadow border border-slate-100">
                    <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4">动作列表管理</h3>
                    <div class="space-y-3">
                        <input type="text" id="lib-new-name" placeholder="动作名称" class="w-full bg-slate-50 border-0 rounded-xl px-4 py-3 text-[13px] font-bold outline-none">
                        <div class="flex gap-2">
                            <select id="lib-new-group" class="flex-1 bg-slate-50 border-0 rounded-xl px-4 py-3 text-[13px] font-bold outline-none">
                                <option>胸部</option><option>背部</option><option>腿部</option><option>肩部</option><option>手臂</option><option>核心</option><option>有氧</option>
                            </select>
                            <button onclick="addLibraryItem()" class="bg-slate-900 text-white px-6 py-3 rounded-xl text-[13px] font-black active:scale-95 transition-all">添加</button>
                        </div>
                    </div>
                </div>
                <div id="lib-list" class="bg-white rounded-[2rem] card-shadow border border-slate-100 overflow-hidden divide-y divide-slate-50"></div>
            </div>

            <!-- 设置 -->
            <div id="tab-settings" class="tab-content p-4 space-y-4">
                <!-- 数据迁移中心 (新增) -->
                <div class="bg-slate-900 rounded-[2rem] p-6 card-shadow text-white space-y-4">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-xl">🛡️</span>
                        <h3 class="text-base font-black">数据安全中心</h3>
                    </div>
                    <p class="text-[11px] text-slate-400 font-bold leading-relaxed">
                        为防止应用更新或浏览器清理导致记录丢失，请定期备份 JSON 数据。备份文件可跨设备、跨浏览器导入恢复。
                    </p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="exportJSONBackup()" class="bg-blue-600 py-3 rounded-xl text-[12px] font-black active:scale-95 transition-all">导出 JSON 备份</button>
                        <button onclick="document.getElementById('import-file').click()" class="bg-slate-700 py-3 rounded-xl text-[12px] font-black active:scale-95 transition-all">从 JSON 恢复</button>
                        <input type="file" id="import-file" class="hidden" accept=".json" onchange="importJSONBackup(this)">
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] p-6 card-shadow border border-slate-100 space-y-6">
                    <div>
                        <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3">个性化标语</h3>
                        <textarea id="settings-banner" class="w-full bg-slate-50 p-4 rounded-xl text-[13px] font-bold outline-none border-0" rows="2"></textarea>
                        <button onclick="updateSettings()" class="mt-3 w-full bg-blue-600 text-white py-3 rounded-xl font-black text-[13px] active:scale-95 transition-all">保存并更新</button>
                    </div>
                    <div class="pt-6 border-t border-slate-50 space-y-3">
                        <button onclick="exportMarkdown()" class="w-full p-4 bg-blue-50 text-blue-600 rounded-xl text-[12px] font-black flex justify-between items-center">
                            <span>导出预览级 Markdown</span><span>📄</span>
                        </button>
                        <button onclick="clearData()" class="w-full p-4 bg-red-50 text-red-500 rounded-xl text-[12px] font-black">清空所有数据</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- 编辑面板 -->
        <div id="editor-overlay" class="fixed inset-0 bg-white z-[100] hidden flex flex-col translate-y-full transition-transform duration-500">
            <div class="px-6 py-4 border-b flex justify-between items-center glass sticky top-0 z-10 header-pt">
                <button onclick="closeEditor(true)" class="text-slate-400 font-black text-[13px] px-2">取消</button>
                <h2 id="editor-title" class="font-black text-base text-slate-800">编辑记录</h2>
                <button onclick="saveWorkout()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-black text-[13px]">完成</button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-4 py-6 space-y-6 bg-slate-50/50 pb-32">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><label class="text-[10px] text-slate-400 font-black block mb-1">日期</label><input type="date" id="edit-date" class="w-full text-[13px] font-black outline-none bg-transparent" oninput="handleEditorInput()"></div>
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><label class="text-[10px] text-slate-400 font-black block mb-1">心情反馈</label><select id="edit-mood" class="w-full text-[15px] font-black outline-none bg-transparent" oninput="handleEditorInput()"><option>😊</option><option>🔥</option><option>😴</option><option>😤</option><option>🤕</option></select></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><label class="text-[10px] text-slate-400 font-black block mb-1">体重 (KG)</label><input type="number" step="0.1" id="edit-weight" class="w-full text-[13px] font-black outline-none bg-transparent mono" placeholder="0.0" oninput="handleEditorInput()"></div>
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm"><label class="text-[10px] text-slate-400 font-black block mb-1">体脂 (%)</label><input type="number" step="0.1" id="edit-fat" class="w-full text-[13px] font-black outline-none bg-transparent mono" placeholder="0.0" oninput="handleEditorInput()"></div>
                </div>

                <!-- Sleep Section -->
                <div class="bg-white rounded-[2rem] p-6 border border-slate-100 shadow-sm space-y-4">
                    <h3 class="font-black text-slate-800 text-base">睡眠记录</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] text-slate-400 font-black block uppercase tracking-wider">入睡时间 (滚轮/点击)</label>
                            <div class="flex items-center gap-1 bg-slate-50 rounded-xl p-2 justify-center">
                                <input type="text" id="sleep-start-h" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-start-h', 23)" onclick="window.adjustValue('sleep-start-h', 1, 23)" oncontextmenu="window.adjustValue('sleep-start-h', -1, 23); return false;">
                                <span class="font-black">:</span>
                                <input type="text" id="sleep-start-m" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-start-m', 59)" onclick="window.adjustValue('sleep-start-m', 5, 59)" oncontextmenu="window.adjustValue('sleep-start-m', -5, 59); return false;">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] text-slate-400 font-black block uppercase tracking-wider">醒来时间 (滚轮/点击)</label>
                            <div class="flex items-center gap-1 bg-slate-50 rounded-xl p-2 justify-center">
                                <input type="text" id="sleep-end-h" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-end-h', 23)" onclick="window.adjustValue('sleep-end-h', 1, 23)" oncontextmenu="window.adjustValue('sleep-end-h', -1, 23); return false;">
                                <span class="font-black">:</span>
                                <input type="text" id="sleep-end-m" class="w-10 bg-transparent text-center font-black mono outline-none cursor-pointer" onwheel="handleWheel(event, 'sleep-end-m', 59)" onclick="window.adjustValue('sleep-end-m', 5, 59)" oncontextmenu="window.adjustValue('sleep-end-m', -5, 59); return false;">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-slate-50 p-2 rounded-xl text-center">
                            <label class="text-[9px] text-slate-400 font-black block mb-1">梦境</label>
                            <input type="number" id="sleep-dreams" class="w-full bg-transparent text-center font-black mono outline-none" value="0" oninput="handleEditorInput()">
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl text-center">
                            <label class="text-[9px] text-slate-400 font-black block mb-1">中途醒来</label>
                            <input type="number" id="sleep-wakes" class="w-full bg-transparent text-center font-black mono outline-none" value="0" oninput="handleEditorInput()">
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl text-center">
                            <label class="text-[9px] text-slate-400 font-black block mb-1">体感</label>
                            <select id="sleep-tiredness" class="w-full bg-transparent text-center font-black outline-none text-[12px]" oninput="handleEditorInput()">
                                <option value="refreshed">精神</option>
                                <option value="normal" selected>正常</option>
                                <option value="tired">疲惫</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="edit-exercises" class="space-y-4"></div>
                <div class="bg-white rounded-[2rem] p-6 border border-slate-100 shadow-sm">
                    <h3 class="font-black text-slate-800 text-base mb-4">常用动作库</h3>
                    <div id="edit-lib-grid" class="grid grid-cols-2 gap-2"></div>
                </div>
                <textarea id="edit-notes" placeholder="记录此刻的心情或备注..." class="w-full bg-white p-5 rounded-[1.5rem] border border-slate-100 min-h-[100px] text-[13px] font-bold outline-none" oninput="handleEditorInput()"></textarea>
                <button id="delete-log-btn" onclick="confirmDeleteCurrentLog()" class="w-full py-4 bg-white text-red-500 rounded-2xl font-black border border-red-50 text-[13px] hidden">删除本条记录</button>
            </div>
        </div>

        <nav class="flex justify-around items-center bg-white/95 backdrop-blur-xl border-t border-slate-100 absolute bottom-0 w-full z-50">
            <button onclick="switchTab('home')" class="nav-btn active-nav flex-1 flex flex-col items-center gap-1 transition-all" data-tab="home"><div class="nav-text text-[15px] font-black">首页</div><div class="nav-dot w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 scale-0 transition-all"></div></button>
            <button onclick="switchTab('calendar')" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all" data-tab="calendar"><div class="nav-text text-[15px] font-black">日历</div><div class="nav-dot w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 scale-0 transition-all"></div></button>
            <button onclick="switchTab('sleep')" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all" data-tab="sleep"><div class="nav-text text-[15px] font-black">睡眠</div><div class="nav-dot w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 scale-0 transition-all"></div></button>
            <button onclick="switchTab('stats')" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all" data-tab="stats"><div class="nav-text text-[15px] font-black">统计</div><div class="nav-dot w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 scale-0 transition-all"></div></button>
            <button onclick="switchTab('library')" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all" data-tab="library"><div class="nav-text text-[15px] font-black">动作库</div><div class="nav-dot w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 scale-0 transition-all"></div></button>
            <button onclick="switchTab('settings')" class="nav-btn flex-1 flex flex-col items-center gap-1 transition-all" data-tab="settings"><div class="nav-text text-[15px] font-black">设置</div><div class="nav-dot w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 scale-0 transition-all"></div></button>
        </nav>
    </div>

    <script>
        const getLocalToday = () => {
            const d = new Date();
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
        };

        const INITIAL_LIB = [
            { id: '1', name: '杠铃卧推', group: '胸部' }, { id: '2', name: '哑铃卧推', group: '胸部' }, 
            { id: '3', name: '上斜哑铃卧推', group: '胸部' }, { id: '4', name: '器械夹胸', group: '胸部' },
            { id: '5', name: '双杠臂屈伸', group: '胸部' }, { id: '6', name: '引体向上', group: '背部' }, 
            { id: '7', name: '杠铃划船', group: '背部' }, { id: '8', name: '高位下拉', group: '背部' }, 
            { id: '9', name: '传统硬拉', group: '背部' }, { id: '10', name: '单臂哑铃划船', group: '背部' },
            { id: '11', name: '杠铃深蹲', group: '腿部' }, { id: '12', name: '腿举', group: '腿部' }, 
            { id: '13', name: '腿屈伸', group: '腿部' }, { id: '14', name: '腿弯举', group: '腿部' },
            { id: '15', name: '保加利亚分腿蹲', group: '腿部' }, { id: '16', name: '站姿推举', group: '肩部' }, 
            { id: '17', name: '哑铃侧平举', group: '肩部' }, { id: '18', name: '哑铃前平举', group: '肩部' }, 
            { id: '19', name: '绳索面拉', group: '肩部' }, { id: '20', name: '哑铃弯举', group: '手臂' }, 
            { id: '21', name: '杠铃弯举', group: '手臂' }, { id: '22', name: '绳索下压', group: '手臂' }, 
            { id: '23', name: '碎头者', group: '手臂' }, { id: '24', name: '悬垂举腿', group: '核心' }, 
            { id: '25', name: '卷腹', group: '核心' }, { id: '26', name: '平板支撑', group: '核心' },
            { id: '27', name: '跑步机', group: '有氧' }, { id: '28', name: '椭圆机', group: '有氧' },
            { id: '29', name: '动感单车', group: '有氧' }, { id: '30', name: '划船机', group: '有氧' }
        ];

        let appState = {
            logs: JSON.parse(localStorage.getItem('fitlog_v2_data') || '[]'),
            library: JSON.parse(localStorage.getItem('fitlog_lib_v2') || JSON.stringify(INITIAL_LIB)),
            banner: localStorage.getItem('fitlog_banner') || '记录蜕变，见证更强的自己！'
        };

        const COLORS = { '胸部': '#3b82f6', '背部': '#10b981', '腿部': '#8b5cf6', '肩部': '#f59e0b', '手臂': '#ec4899', '核心': '#ef4444', '有氧': '#06b6d4', '睡眠': '#8b5cf6' };
        let currentMonth = new Date();
        let currentSleepMonth = new Date();
        let currentEditLog = null;
        let charts = { sbd: null, weight: null, fat: null, volume: null, sleep: null };

        window.handleWheel = (e, id, max) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1 : -1;
            window.adjustValue(id, delta, max);
        };

        window.adjustValue = (id, delta, max) => {
            const input = document.getElementById(id);
            let val = parseInt(input.value) || 0;
            val += delta;
            if (val > max) val = 0;
            if (val < 0) val = max;
            input.value = String(val).padStart(2, '0');
            if (!id.includes('tab')) {
                handleEditorInput();
            }
        };

        function calculateSleepDuration(sleep) {
            if (!sleep || !sleep.start || !sleep.end) return 0;
            const start = sleep.start.split(':').map(Number);
            const end = sleep.end.split(':').map(Number);
            let diff = (end[0] * 60 + end[1]) - (start[0] * 60 + start[1]);
            if (diff < 0) diff += 24 * 60;
            return (diff / 60).toFixed(1);
        }

        window.loadSleepDataForDate = (date) => {
            const log = appState.logs.find(l => l.date === date);
            const sleep = log?.sleep || { start: '01:00', end: '09:05', dreams: 0, wakes: 0, tiredness: 'normal' };
            const [sh, sm] = sleep.start.split(':');
            const [eh, em] = sleep.end.split(':');
            document.getElementById('sleep-tab-start-h').value = sh;
            document.getElementById('sleep-tab-start-m').value = sm;
            document.getElementById('sleep-tab-end-h').value = eh;
            document.getElementById('sleep-tab-end-m').value = em;
            document.getElementById('sleep-tab-dreams').value = sleep.dreams;
            document.getElementById('sleep-tab-wakes').value = sleep.wakes;
            document.getElementById('sleep-tab-tiredness').value = sleep.tiredness;
        };

        window.saveSleepFromTab = () => {
            const date = document.getElementById('sleep-tab-date').value;
            if (!date) return alert('请选择日期');
            let log = appState.logs.find(l => l.date === date);
            const sleepData = {
                start: `${document.getElementById('sleep-tab-start-h').value}:${document.getElementById('sleep-tab-start-m').value}`,
                end: `${document.getElementById('sleep-tab-end-h').value}:${document.getElementById('sleep-tab-end-m').value}`,
                dreams: parseInt(document.getElementById('sleep-tab-dreams').value) || 0,
                wakes: parseInt(document.getElementById('sleep-tab-wakes').value) || 0,
                tiredness: document.getElementById('sleep-tab-tiredness').value
            };
            if (log) {
                log.sleep = sleepData;
            } else {
                appState.logs.push({
                    id: Date.now().toString(),
                    date: date,
                    exercises: [],
                    mood: '😊',
                    weight: null,
                    bodyFat: null,
                    notes: '',
                    sleep: sleepData
                });
            }
            localStorage.setItem('fitlog_v2_data', JSON.stringify(appState.logs));
            renderSleepTab();
            alert('睡眠记录已保存 🌙');
        };

        function init() {
            document.getElementById('header-banner').textContent = appState.banner;
            document.getElementById('settings-banner').value = appState.banner;
            renderHome();
        }

        // 数据备份功能 (JSON)
        window.exportJSONBackup = () => {
            const data = {
                version: "2.1",
                logs: appState.logs,
                library: appState.library,
                banner: appState.banner,
                timestamp: Date.now()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `FitLog_Backup_${getLocalToday()}.json`;
            a.click();
        };

        window.importJSONBackup = (input) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.logs || !Array.isArray(data.logs)) throw new Error("无效的备份文件");
                    
                    if (confirm("导入备份将合并或覆盖当前记录。确定继续吗？")) {
                        appState.logs = data.logs;
                        appState.library = data.library || appState.library;
                        appState.banner = data.banner || appState.banner;
                        
                        localStorage.setItem('fitlog_v2_data', JSON.stringify(appState.logs));
                        localStorage.setItem('fitlog_lib_v2', JSON.stringify(appState.library));
                        localStorage.setItem('fitlog_banner', appState.banner);
                        
                        alert("数据恢复成功！正在重新加载...");
                        location.reload();
                    }
                } catch (err) {
                    alert("导入失败: " + err.message);
                }
            };
            reader.readAsText(file);
        };

        function handleEditorInput() { syncCurrentInputsToState(); saveDraft(); }
        function saveDraft() { if (currentEditLog) localStorage.setItem('fitlog_editor_draft', JSON.stringify(currentEditLog)); }
        function clearDraft() { localStorage.removeItem('fitlog_editor_draft'); }

        function addLibraryItem() {
            const name = document.getElementById('lib-new-name').value.trim();
            const group = document.getElementById('lib-new-group').value;
            if(!name) return;
            
            // Find the last index of the same group to insert after it
            let lastIndex = -1;
            for (let i = 0; i < appState.library.length; i++) {
                if (appState.library[i].group === group) lastIndex = i;
            }
            
            const newItem = { id: Date.now().toString(), name, group };
            if (lastIndex === -1) {
                appState.library.push(newItem);
            } else {
                appState.library.splice(lastIndex + 1, 0, newItem);
            }
            
            localStorage.setItem('fitlog_lib_v2', JSON.stringify(appState.library));
            renderLibrary();
            document.getElementById('lib-new-name').value = '';
        }

        function renderLibrary() {
            const list = document.getElementById('lib-list');
            const grouped = {};
            appState.library.forEach((item, index) => {
                if (!grouped[item.group]) grouped[item.group] = [];
                grouped[item.group].push({ ...item, originalIndex: index });
            });

            const groupsOrder = ['胸部', '背部', '腿部', '肩部', '手臂', '核心', '有氧'];
            
            list.innerHTML = groupsOrder.map(group => {
                const items = grouped[group] || [];
                if (items.length === 0) return '';
                return `
                    <div class="bg-slate-50/50 px-4 py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">${group}</div>
                    ${items.map((item, idx) => `
                        <div class="flex items-center justify-between p-4 bg-white hover:bg-slate-50 transition-colors group">
                            <div class="flex items-center gap-3">
                                <div class="w-2.5 h-2.5 rounded-full" style="background:${COLORS[item.group] || '#ddd'}"></div>
                                <div class="text-[14px] font-black text-slate-800">${item.name}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="flex flex-col gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="moveLibItem(${item.originalIndex}, -1)" class="w-6 h-6 flex items-center justify-center bg-slate-50 rounded text-slate-400 hover:text-blue-600">↑</button>
                                    <button onclick="moveLibItem(${item.originalIndex}, 1)" class="w-6 h-6 flex items-center justify-center bg-slate-50 rounded text-slate-400 hover:text-blue-600">↓</button>
                                </div>
                                <button onclick="deleteLibItem('${item.id}')" class="text-slate-200 hover:text-red-400 text-xl font-bold px-2">×</button>
                            </div>
                        </div>
                    `).join('')}
                `;
            }).join('');
        }

        window.moveLibItem = (index, direction) => {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= appState.library.length) return;
            
            // Only allow moving within the same group for better UX as requested
            if (appState.library[index].group !== appState.library[newIndex].group) {
                // If moving across groups, we still allow it but it might be confusing
                // The user said "加到对应部位的动作最后", implying group-based order
            }
            
            const temp = appState.library[index];
            appState.library[index] = appState.library[newIndex];
            appState.library[newIndex] = temp;
            
            localStorage.setItem('fitlog_lib_v2', JSON.stringify(appState.library));
            renderLibrary();
        };

        window.deleteLibItem = (id) => {
            if(!confirm('确定移除此动作？')) return;
            appState.library = appState.library.filter(i => i.id !== id);
            localStorage.setItem('fitlog_lib_v2', JSON.stringify(appState.library));
            renderLibrary();
        };

        function syncCurrentInputsToState() {
            if (!currentEditLog) return;
            currentEditLog.date = document.getElementById('edit-date').value;
            currentEditLog.mood = document.getElementById('edit-mood').value;
            currentEditLog.weight = parseFloat(document.getElementById('edit-weight').value) || null;
            currentEditLog.bodyFat = parseFloat(document.getElementById('edit-fat').value) || null;
            currentEditLog.notes = document.getElementById('edit-notes').value;
            
            currentEditLog.sleep = {
                start: `${document.getElementById('sleep-start-h').value}:${document.getElementById('sleep-start-m').value}`,
                end: `${document.getElementById('sleep-end-h').value}:${document.getElementById('sleep-end-m').value}`,
                dreams: parseInt(document.getElementById('sleep-dreams').value) || 0,
                wakes: parseInt(document.getElementById('sleep-wakes').value) || 0,
                tiredness: document.getElementById('sleep-tiredness').value
            };
        }

        window.openEditor = (id = null) => {
            const overlay = document.getElementById('editor-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.style.transform = 'translateY(0)', 10);
            const deleteBtn = document.getElementById('delete-log-btn');
            if (id) {
                currentEditLog = JSON.parse(JSON.stringify(appState.logs.find(l => l.id === id)));
                deleteBtn.classList.remove('hidden');
            } else {
                const draft = localStorage.getItem('fitlog_editor_draft');
                currentEditLog = draft ? JSON.parse(draft) : { 
                    id: Date.now().toString(), 
                    date: getLocalToday(), 
                    exercises: [], 
                    mood: '😊', 
                    weight: null, 
                    bodyFat: null, 
                    notes: '',
                    sleep: { start: '01:00', end: '09:05', dreams: 0, wakes: 0, tiredness: 'normal' }
                };
                deleteBtn.classList.add('hidden');
            }
            if (!currentEditLog.sleep) {
                currentEditLog.sleep = { start: '01:00', end: '09:05', dreams: 0, wakes: 0, tiredness: 'normal' };
            }
            document.getElementById('edit-date').value = currentEditLog.date;
            document.getElementById('edit-mood').value = currentEditLog.mood;
            document.getElementById('edit-weight').value = currentEditLog.weight || '';
            document.getElementById('edit-fat').value = currentEditLog.bodyFat || '';
            document.getElementById('edit-notes').value = currentEditLog.notes;
            
            const [sh, sm] = currentEditLog.sleep.start.split(':');
            const [eh, em] = currentEditLog.sleep.end.split(':');
            document.getElementById('sleep-start-h').value = sh;
            document.getElementById('sleep-start-m').value = sm;
            document.getElementById('sleep-end-h').value = eh;
            document.getElementById('sleep-end-m').value = em;
            document.getElementById('sleep-dreams').value = currentEditLog.sleep.dreams;
            document.getElementById('sleep-wakes').value = currentEditLog.sleep.wakes;
            document.getElementById('sleep-tiredness').value = currentEditLog.sleep.tiredness;
            
            syncEditorUI();
        };

        window.closeEditor = () => {
            const overlay = document.getElementById('editor-overlay');
            overlay.style.transform = 'translateY(100%)';
            setTimeout(() => overlay.classList.add('hidden'), 500);
        };

        function syncEditorUI() {
            const list = document.getElementById('edit-exercises');
            list.innerHTML = currentEditLog.exercises.map((ex, exIdx) => `
                <div class="bg-white rounded-[1.5rem] p-5 border-l-[8px] shadow-sm relative" style="border-color:${COLORS[ex.group] || '#ddd'}">
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-black text-[14px] text-slate-800">${ex.name}</span>
                        <button onclick="removeEx(${exIdx})" class="text-red-400 font-black text-[11px] uppercase">移除</button>
                    </div>
                    <div class="space-y-2">
                        ${ex.sets.map((s, sIdx) => `
                            <div class="grid grid-cols-4 gap-2 items-center">
                                <span class="bg-slate-50 text-slate-500 font-black h-10 flex items-center justify-center rounded-xl mono text-[12px]">${sIdx+1}</span>
                                <input type="number" step="0.5" value="${s.weight}" class="bg-slate-50 h-10 text-center rounded-xl font-black mono outline-none text-[13px]" oninput="updateSetData(${exIdx},${sIdx},'weight',this.value)">
                                <input type="number" step="1" value="${s.reps}" class="bg-slate-50 h-10 text-center rounded-xl font-black mono outline-none text-[13px]" oninput="updateSetData(${exIdx},${sIdx},'reps',this.value)">
                                <button onclick="removeSet(${exIdx},${sIdx})" class="text-slate-200 text-2xl font-bold">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="addSet(${exIdx})" class="w-full mt-4 py-2.5 bg-slate-50 text-[11px] font-black rounded-xl border border-dashed border-slate-200 text-slate-400">+ 新组次</button>
                </div>
            `).join('');
            const grid = document.getElementById('edit-lib-grid');
            grid.innerHTML = appState.library.map(item => `<button onclick="quickAddEx('${item.id}')" class="p-3 bg-white rounded-xl text-[12px] font-black border border-slate-100 shadow-sm text-left active:scale-95 transition-all"><div class="text-[9px] opacity-30 uppercase mb-0.5" style="color:${COLORS[item.group]}">${item.group}</div><div class="truncate text-slate-700">${item.name}</div></button>`).join('');
        }

        window.updateSetData = (exIdx, sIdx, field, val) => { currentEditLog.exercises[exIdx].sets[sIdx][field] = parseFloat(val) || 0; saveDraft(); };
        window.addSet = (idx) => { syncCurrentInputsToState(); const ex = currentEditLog.exercises[idx]; const last = ex.sets[ex.sets.length - 1]; ex.sets.push({ weight: last ? last.weight : 0, reps: last ? last.reps : 0 }); syncEditorUI(); saveDraft(); };
        window.removeSet = (exIdx, sIdx) => { syncCurrentInputsToState(); if(currentEditLog.exercises[exIdx].sets.length > 1) { currentEditLog.exercises[exIdx].sets.splice(sIdx, 1); syncEditorUI(); saveDraft(); } };
        window.removeEx = (idx) => { syncCurrentInputsToState(); currentEditLog.exercises.splice(idx, 1); syncEditorUI(); saveDraft(); };
        window.quickAddEx = (libId) => { syncCurrentInputsToState(); const item = appState.library.find(i => i.id === libId); currentEditLog.exercises.push({ ...item, sets: [{ weight: 0, reps: 0 }] }); syncEditorUI(); saveDraft(); };

        window.saveWorkout = () => {
            syncCurrentInputsToState();
            if(!currentEditLog.exercises.length) return alert('请至少记录一个动作');
            const idx = appState.logs.findIndex(l => l.id === currentEditLog.id);
            if(idx > -1) appState.logs[idx] = currentEditLog; else appState.logs.push(currentEditLog);
            localStorage.setItem('fitlog_v2_data', JSON.stringify(appState.logs));
            clearDraft(); renderHome(); closeEditor();
        };

        window.confirmDeleteCurrentLog = () => {
            if(!confirm('确定删除此记录？')) return;
            appState.logs = appState.logs.filter(l => l.id !== currentEditLog.id);
            localStorage.setItem('fitlog_v2_data', JSON.stringify(appState.logs));
            clearDraft(); renderHome(); closeEditor();
        };

        function calculateLogVolume(log) { return log.exercises.reduce((acc, ex) => acc + ex.sets.reduce((sAcc, s) => sAcc + (s.weight * s.reps), 0), 0); }

        function renderHome() {
            const list = document.getElementById('log-list');
            const sorted = [...appState.logs].sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('stat-total').textContent = sorted.length;
            const now = new Date();
            document.getElementById('stat-month').textContent = sorted.filter(l => {
                const d = new Date(l.date.replace(/-/g, '/'));
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            }).length;
            if(!sorted.length) { list.innerHTML = '<div class="py-20 text-center text-slate-300 font-bold italic">没有记录</div>'; return; }
            list.innerHTML = sorted.map(log => `
                <div class="bg-white rounded-[1.5rem] p-6 card-shadow border border-slate-50 space-y-4">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-4"><span class="text-4xl leading-none">${log.mood || '😊'}</span><div><h3 class="font-black text-[14px] text-slate-800">${log.date}</h3><p class="text-[10px] font-black text-slate-300 tracking-widest mt-0.5 uppercase">容量: ${calculateLogVolume(log)}kg | ${log.weight || '--'}kg ${log.sleep ? `| 💤 ${calculateSleepDuration(log.sleep)}h` : ''}</p></div></div>
                        <button onclick="openEditor('${log.id}')" class="px-4 py-1.5 text-blue-600 font-black text-[11px] bg-blue-50 rounded-full">编辑</button>
                    </div>
                    ${log.notes ? `<div class="bg-slate-50/50 p-3 rounded-xl border-l-4 border-slate-200"><p class="text-[11px] text-slate-500 font-medium leading-relaxed italic">"${log.notes}"</p></div>` : ''}
                    <div class="space-y-2">
                        ${log.exercises.map(ex => `
                            <div class="bg-slate-50 p-3 rounded-xl flex items-center justify-between">
                                <div class="flex-1 flex flex-col gap-1"><div class="flex items-center justify-between"><div class="text-[13px] font-black text-slate-800">${ex.name}</div><div class="flex flex-wrap gap-1">${ex.sets.map(s => `<span class="bg-white px-1.5 py-0.5 rounded-lg border border-slate-200 text-[10px] font-black mono text-slate-500">${s.weight}×${s.reps}</span>`).join('')}</div></div></div>
                                <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full text-white shrink-0 ml-3" style="background:${COLORS[ex.group] || '#ddd'}">${ex.group}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active-nav'));
            document.querySelector(`[data-tab="${id}"]`).classList.add('active-nav');
            if(id === 'calendar') renderCalendar();
            if(id === 'stats') renderStats();
            if(id === 'library') renderLibrary();
            if(id === 'sleep') renderSleepTab();
        };

        function renderSleepTab() {
            const dateInput = document.getElementById('sleep-tab-date');
            if (!dateInput.value) {
                dateInput.value = getLocalToday();
                loadSleepDataForDate(dateInput.value);
            }
            renderSleepStats();
            renderSleepCalendar();
        }

        function renderSleepStats() {
            const logs = [...appState.logs].sort((a,b) => new Date(a.date) - new Date(b.date));
            const labels = logs.map(l => l.date.slice(5));
            const zoomOptions = {
                pan: { enabled: true, mode: 'x' },
                zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
            };

            if(charts.sleep) charts.sleep.destroy();
            charts.sleep = new Chart(document.getElementById('sleep-chart'), { 
                type: 'line', 
                data: { 
                    labels, 
                    datasets: [{ 
                        data: logs.map(l => calculateSleepDuration(l.sleep)), 
                        borderColor: '#8b5cf6', 
                        backgroundColor: 'rgba(139, 92, 246, 0.1)', 
                        fill: true, 
                        tension: 0.4 
                    }] 
                }, 
                options: { plugins: { legend: { display: false }, zoom: zoomOptions }, scales: { y: { beginAtZero: true } } } 
            });
        }

        function renderSleepCalendar() {
            const grid = document.getElementById('sleep-calendar-days'); grid.innerHTML = '';
            const y = currentSleepMonth.getFullYear(), m = currentSleepMonth.getMonth();
            const names = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
            document.getElementById('sleep-calendar-title').innerHTML = `${y}年 ${names[m]}`;
            const first = new Date(y, m, 1).getDay();
            const daysCount = new Date(y, m+1, 0).getDate();
            for(let i=0; i<first; i++) grid.appendChild(document.createElement('div'));
            
            const tirednessColors = { refreshed: 'bg-emerald-400', normal: 'bg-blue-400', tired: 'bg-amber-400' };

            for(let d=1; d<=daysCount; d++) {
                const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const log = appState.logs.find(l => l.date === iso);
                const hasSleep = log && log.sleep;
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `flex flex-col items-center justify-center min-h-[40px] rounded-lg cursor-pointer transition-all ${hasSleep ? 'bg-slate-50 border border-slate-100' : 'hover:bg-slate-50'}`;
                dayDiv.innerHTML = `<span class="text-[10px] font-black ${hasSleep ? 'text-slate-800' : 'text-slate-300'}">${d}</span>${hasSleep ? `<div class="w-1.5 h-1.5 rounded-full mt-1 ${tirednessColors[log.sleep.tiredness] || 'bg-slate-300'}"></div>` : ''}`;
                dayDiv.onclick = () => {
                    document.getElementById('sleep-tab-date').value = iso;
                    loadSleepDataForDate(iso);
                };
                grid.appendChild(dayDiv);
            }
        }

        window.changeSleepMonth = (dir) => { currentSleepMonth.setMonth(currentSleepMonth.getMonth()+dir); renderSleepCalendar(); };

        function renderStats() {
            const logs = [...appState.logs].sort((a,b) => new Date(a.date) - new Date(b.date));
            const prs = { s: 0, b: 0, d: 0 };
            logs.forEach(l => l.exercises.forEach(ex => {
                const max = Math.max(...ex.sets.map(s => s.weight));
                if(ex.name.includes('深蹲')) prs.s = Math.max(prs.s, max);
                if(ex.name.includes('卧推')) prs.b = Math.max(prs.b, max);
                if(ex.name.includes('硬拉')) prs.d = Math.max(prs.d, max);
            }));
            document.getElementById('pr-squat').textContent = prs.s || '--';
            document.getElementById('pr-bench').textContent = prs.b || '--';
            document.getElementById('pr-deadlift').textContent = prs.d || '--';
            
            const labels = logs.map(l => l.date.slice(5));
            const zoomOptions = {
                pan: { enabled: true, mode: 'x' },
                zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
            };

            if(charts.volume) charts.volume.destroy();
            charts.volume = new Chart(document.getElementById('volume-chart'), { 
                type: 'bar', 
                data: { labels, datasets: [{ label: '容量', data: logs.map(l => calculateLogVolume(l)), backgroundColor: 'rgba(59, 130, 246, 0.4)', borderRadius: 8 }] }, 
                options: { plugins: { legend: { display: false }, zoom: zoomOptions }, scales: { y: { beginAtZero: true } } } 
            });
            
            if(charts.sbd) charts.sbd.destroy();
            charts.sbd = new Chart(document.getElementById('sbd-chart'), { 
                type: 'line', 
                data: { labels, datasets: [{ label: '蹲', data: logs.map(l => { const e = l.exercises.find(e => e.name.includes('深蹲')); return e ? Math.max(...e.sets.map(s => s.weight)) : null; }), borderColor: '#ef4444', tension: 0.4, spanGaps: true }, { label: '推', data: logs.map(l => { const e = l.exercises.find(e => e.name.includes('卧推')); return e ? Math.max(...e.sets.map(s => s.weight)) : null; }), borderColor: '#3b82f6', tension: 0.4, spanGaps: true }, { label: '拉', data: logs.map(l => { const e = l.exercises.find(e => e.name.includes('硬拉')); return e ? Math.max(...e.sets.map(s => s.weight)) : null; }), borderColor: '#1e293b', tension: 0.4, spanGaps: true }] },
                options: { plugins: { zoom: zoomOptions } }
            });
            
            if(charts.weight) charts.weight.destroy();
            charts.weight = new Chart(document.getElementById('weight-chart'), { 
                type: 'line', 
                data: { labels, datasets: [{ data: logs.map(l => l.weight), borderColor: '#f97316', backgroundColor: 'rgba(249, 115, 22, 0.1)', fill: true, tension: 0.4 }] }, 
                options: { plugins: { legend: { display: false }, zoom: zoomOptions } } 
            });
            
            if(charts.fat) charts.fat.destroy();
            charts.fat = new Chart(document.getElementById('fat-chart'), { 
                type: 'line', 
                data: { labels, datasets: [{ data: logs.map(l => l.bodyFat), borderColor: '#ec4899', backgroundColor: 'rgba(236, 72, 153, 0.1)', fill: true, tension: 0.4 }] }, 
                options: { plugins: { legend: { display: false }, zoom: zoomOptions } } 
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-days'); grid.innerHTML = '';
            const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
            const names = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
            document.getElementById('calendar-title').innerHTML = `${y}年 ${names[m]}`;
            const first = new Date(y, m, 1).getDay();
            const daysCount = new Date(y, m+1, 0).getDate();
            for(let i=0; i<first; i++) grid.appendChild(document.createElement('div'));
            for(let d=1; d<=daysCount; d++) {
                const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayLogs = appState.logs.filter(l => l.date === iso);
                const hasLog = dayLogs.length > 0;
                let mainGroup = "";
                if (hasLog) {
                    const groupCounts = {};
                    dayLogs.forEach(log => log.exercises.forEach(ex => groupCounts[ex.group] = (groupCounts[ex.group] || 0) + 1));
                    const entries = Object.entries(groupCounts).sort((a,b) => b[1] - a[1]);
                    mainGroup = entries.length > 0 ? entries[0][0] : "睡眠";
                }
                const dayDiv = document.createElement('div');
                dayDiv.className = `flex flex-col items-center justify-start min-h-[50px] py-1 rounded-xl cursor-pointer transition-all ${hasLog ? 'bg-slate-50 border border-slate-100 shadow-sm' : 'hover:bg-slate-50'}`;
                dayDiv.innerHTML = `<span class="text-[12px] font-black ${hasLog ? 'text-blue-600' : 'text-slate-400'}">${d}</span>${hasLog ? `<div class="mt-1 w-full px-1 flex flex-col items-center gap-0.5"><div class="w-2 h-2 rounded-full" style="background:${COLORS[mainGroup]}"></div><span class="text-[8px] font-bold text-slate-400 scale-90 whitespace-nowrap">${calculateLogVolume(dayLogs[0])}kg</span></div>` : ''}`;
                dayDiv.onclick = () => {
                    const detail = document.getElementById('calendar-detail');
                    detail.innerHTML = dayLogs.length ? dayLogs.map(log => `<div class="bg-white p-5 rounded-2xl mt-3 shadow-sm flex justify-between items-center group active:scale-95 transition-all"><div class="flex items-center gap-3"><span class="text-3xl">${log.mood || '😊'}</span><div><div class="font-black text-slate-800 text-[14px]">${log.date} 训练日</div><div class="text-[10px] font-bold text-slate-400 uppercase mt-0.5">主练部位: ${mainGroup} | 容量: ${calculateLogVolume(log)}kg</div></div></div><button onclick="openEditor('${log.id}')" class="bg-blue-50 px-4 py-2 rounded-xl text-blue-600 font-black text-[11px]">查看详情</button></div>`).join('') : '<div class="p-10 text-center text-slate-300 text-[12px] italic">今日给自己放了个假 💤</div>';
                };
                grid.appendChild(dayDiv);
            }
        }
        window.changeMonth = (dir) => { currentMonth.setMonth(currentMonth.getMonth()+dir); renderCalendar(); };
        window.updateSettings = () => { appState.banner = document.getElementById('settings-banner').value; localStorage.setItem('fitlog_banner', appState.banner); document.getElementById('header-banner').textContent = appState.banner; alert('标语更新成功 ✨'); };
        window.exportMarkdown = () => {
            let md = "# FitLog 训练日志导出\n\n";
            [...appState.logs].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(l => {
                md += `## ${l.date} ${l.mood}\n- 总容量: ${calculateLogVolume(l)}kg\n- 体重: ${l.weight || '--'}kg / 体脂: ${l.bodyFat || '--'}%\n`;
                l.exercises.forEach(ex => { md += `### ${ex.name} (${ex.group})\n`; ex.sets.forEach((s, i) => md += `- 组${i+1}: ${s.weight}kg x ${s.reps}次\n`); });
                if(l.notes) md += `\n> 📝 备注: ${l.notes}\n`;
                md += `\n---\n\n`;
            });
            const blob = new Blob([md], {type:'text/markdown'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `FitLog_Export_${getLocalToday()}.md`; a.click();
        };
        window.clearData = () => { if(confirm('⚠️ 确定要清空所有数据吗？此操作无法撤销。')) { localStorage.clear(); location.reload(); } };
        init();
    </script>
<script type="module" src="/index.tsx"></script>
</body>
